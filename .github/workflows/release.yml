name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install release tooling
        run: python -m pip install build check-wheel-contents cyclonedx-bom twine
      - name: Verify tag matches package version
        run: |
          package_version="$(python -c 'from kfbatch import __version__; print(__version__)')"
          test "$GITHUB_REF_NAME" = "v$package_version"
      - name: Build and validate distributions
        run: |
          python -m build
          python -m twine check --strict dist/*
          check-wheel-contents dist/*.whl
      - name: Generate checksums and software bill of materials
        run: |
          python -m pip install --force-reinstall dist/*.whl
          python -m cyclonedx_py environment --output-file dist/kfbatch-sbom.json
          cd dist
          sha256sum -- ./*.whl ./*.tar.gz ./kfbatch-sbom.json > SHA256SUMS
      - name: Attest build provenance
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
            dist/kfbatch-sbom.json
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag
