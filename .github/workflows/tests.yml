name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest -q

  minimum-pandas:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
          cache: pip
      - name: Install minimum supported pandas
        run: |
          python -m pip install "numpy<2" "pandas==1.5.3"
          python -m pip install --no-deps -e .
          python -m pip install pytest
      - name: Run tests
        run: python -m pytest -q

  quality-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Lint and format check
        run: |
          python -m ruff check .
          python -m ruff format --check .
          python -m bandit -q -c pyproject.toml -r kfbatch
      - name: Audit runtime dependencies
        run: python -m pip_audit .
      - name: Run tests with coverage
        run: |
          python -m pytest \
            --cov=kfbatch \
            --cov-branch \
            --cov-report=term-missing \
            --cov-fail-under=70
      - name: Build wheel and source distribution
        run: python -m build
      - name: Verify source distribution contents
        run: |
          tar -tzf dist/*.tar.gz | grep '/docs/assets/kfbatch-header.png$'
          tar -tzf dist/*.tar.gz | grep '/tests/fixtures/age/qstat_f_1.txt$'
          tar -tzf dist/*.tar.gz | grep '/tests/fixtures/slurm/nodes.txt$'
          tar -tzf dist/*.tar.gz | grep '/kfbatch/kfbatch$'
          tar -tzf dist/*.tar.gz | grep '/CHANGELOG.md$'
      - name: Install built wheel and check CLI
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          kfbatch --version
          kfbatch -h
          python -m kfbatch -h
      - name: Install source distribution in a clean environment
        run: |
          python -m venv /tmp/kfbatch-sdist-venv
          /tmp/kfbatch-sdist-venv/bin/python -m pip install dist/*.tar.gz
          /tmp/kfbatch-sdist-venv/bin/kfbatch --version
