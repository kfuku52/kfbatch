name: tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref_type == 'branch' }}

jobs:
  validation-route:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.route.outputs.run }}
    steps:
      - name: Prefer PR merge validation for branches with an open PR
        id: route
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          BRANCH: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          run_validation=true
          if [ "$EVENT_NAME" = push ] && [ "$REF_TYPE" = branch ] && [ "$BRANCH" != "$DEFAULT_BRANCH" ]; then
            pr_heads=$(gh api --method GET "repos/$GITHUB_REPOSITORY/pulls" --paginate \
              -f state=open -f "head=$GITHUB_REPOSITORY_OWNER:$BRANCH" \
              --jq '.[] | .head.repo.full_name + ":" + .head.sha')
            if printf '%s\n' "$pr_heads" | grep -Fxq "$GITHUB_REPOSITORY:$GITHUB_SHA"; then
              run_validation=false
            fi
          fi
          echo "run=$run_validation" >> "$GITHUB_OUTPUT"

  test:
    needs: validation-route
    if: needs.validation-route.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Python 3.12 runs the full suite with coverage in quality-and-package.
        python-version: ["3.10", "3.11", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install -e . pytest PyYAML
      - name: Run tests
        run: python -m pytest -q

  minimum-pandas:
    needs: validation-route
    if: needs.validation-route.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
          cache: pip
      - name: Install minimum supported pandas
        run: |
          python -m pip install "pandas==2.2.2"
          python -m pip install --no-deps -e .
          python -m pip install pytest PyYAML
          python -c "import numpy, pandas; print(numpy.__version__, pandas.__version__)"
      - name: Run tests
        run: python -m pytest -q

  quality-and-package:
    needs: validation-route
    if: needs.validation-route.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Lint and format check
        run: |
          python -m ruff check .
          python -m ruff format --check .
          python -m bandit -q -c pyproject.toml -r kfbatch
          python -m mypy
      - name: Audit runtime dependencies
        run: python -m pip_audit .
      - name: Run tests with coverage
        run: |
          python -m pytest \
            --cov=kfbatch \
            --cov-branch \
            --cov-report=term-missing \
            --cov-fail-under=70
      - name: Build wheel and source distribution
        run: python -m build
      - name: Validate package metadata and wheel contents
        run: |
          python -m twine check --strict dist/*
          check-wheel-contents dist/*.whl
      - name: Verify source distribution contents
        run: |
          tar -tzf dist/*.tar.gz | grep '/docs/assets/kfbatch-header.png$'
          tar -tzf dist/*.tar.gz | grep '/tests/fixtures/age/qstat_f_1.txt$'
          tar -tzf dist/*.tar.gz | grep '/tests/fixtures/slurm/nodes.txt$'
          tar -tzf dist/*.tar.gz | grep '/benchmarks/benchmark_parsers.py$'
          tar -tzf dist/*.tar.gz | grep '/kfbatch/kfbatch$'
          tar -tzf dist/*.tar.gz | grep '/CHANGELOG.md$'
      - name: Install built wheel and run fixture smoke test outside repository
        run: |
          wheel_path="$(realpath dist/*.whl)"
          fixture_root="$GITHUB_WORKSPACE/tests/fixtures"
          smoke_dir="$(mktemp -d)"
          python -m venv /tmp/kfbatch-wheel-venv
          /tmp/kfbatch-wheel-venv/bin/python -m pip install "$wheel_path"
          cd "$smoke_dir"
          /tmp/kfbatch-wheel-venv/bin/kfbatch --version
          /tmp/kfbatch-wheel-venv/bin/python -m kfbatch -h
          /tmp/kfbatch-wheel-venv/bin/kfbatch \
            --current_user current_user \
            --example_file "$fixture_root/slurm/squeue_full.txt" \
            --slurm_node_example_file "$fixture_root/slurm/nodes.txt" \
            --slurm_partition_example_file "$fixture_root/slurm/partitions.txt" \
            --slurm_reservation_example_file "$fixture_root/slurm/reservations.txt" \
            --slurm_prio_example_file "$fixture_root/slurm/sprio.txt" \
            --slurm_share_example_file "$fixture_root/slurm/sshare.txt" \
            > slurm.txt
          grep 'all:R/Q/X/O=4/2/0/0' slurm.txt
          /tmp/kfbatch-wheel-venv/bin/kfbatch \
            --current_user current_user \
            --stat_command "qstat -F" \
            --example_file "$fixture_root/age/qstat_f_1.txt" \
            --uge_job_example_file "$fixture_root/age/qstat_all_users.txt" \
            --uge_qfree_example_file "$fixture_root/age/qfree.txt" \
            > age.txt
          grep 'all:R/Q/F=4/248/5' age.txt
      - name: Install source distribution in a clean environment
        run: |
          python -m venv /tmp/kfbatch-sdist-venv
          /tmp/kfbatch-sdist-venv/bin/python -m pip install dist/*.tar.gz
          /tmp/kfbatch-sdist-venv/bin/kfbatch --version
      - name: Retain validated distributions for the tag release
        if: github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-distributions-${{ github.sha }}
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          overwrite: true
          retention-days: 1
