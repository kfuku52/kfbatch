name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install -e . pytest
      - name: Run tests
        run: python -m pytest -q

  quality-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Lint and format check
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Run tests with coverage
        run: |
          python -m pytest \
            --cov=kfbatch \
            --cov-report=term-missing \
            --cov-fail-under=70
      - name: Build wheel and source distribution
        run: python -m build
      - name: Verify source distribution contents
        run: |
          tar -tzf dist/*.tar.gz | grep '/docs/assets/kfbatch-header.png$'
          tar -tzf dist/*.tar.gz | grep '/tests/fixtures/age/qstat_f_1.txt$'
          tar -tzf dist/*.tar.gz | grep '/tests/fixtures/slurm/nodes.txt$'
          tar -tzf dist/*.tar.gz | grep '/kfbatch/kfbatch$'
      - name: Install built wheel and check CLI
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          kfbatch -h
