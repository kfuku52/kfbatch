[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kfbatch"
dynamic = ["version"]
description = "Compact resource summaries for SLURM and Grid Engine batch clusters"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Kenji Fukushima", email = "kfuku52@gmail.com"},
]
keywords = ["batch", "cluster", "slurm", "altair-grid-engine", "uge", "sge"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "pandas>=2.2.2",
]

[project.optional-dependencies]
dev = [
    "bandit",
    "build",
    "check-wheel-contents",
    "coverage>=7.10",
    "mypy",
    "pip-audit",
    "pytest",
    "pytest-cov>=7",
    "ruff",
    "twine",
]

[project.urls]
Homepage = "https://github.com/kfuku52/kfbatch"
Repository = "https://github.com/kfuku52/kfbatch"
Changelog = "https://github.com/kfuku52/kfbatch/blob/main/CHANGELOG.md"
Issues = "https://github.com/kfuku52/kfbatch/issues"

[project.scripts]
kfbatch = "kfbatch.cli:main"

[tool.setuptools.dynamic]
version = {attr = "kfbatch.__version__"}

[tool.setuptools.packages.find]
include = ["kfbatch*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
parallel = true
patch = ["subprocess"]
source = ["kfbatch"]

[tool.coverage.report]
fail_under = 70
show_missing = true

[tool.mypy]
check_untyped_defs = true
files = ["kfbatch"]
ignore_missing_imports = true
no_implicit_optional = true
python_version = "3.10"
warn_redundant_casts = true
warn_unused_ignores = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["B", "C901", "E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B105"]
