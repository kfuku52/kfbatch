[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kfbatch"
dynamic = ["version"]
description = "Batch job management"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Kenji Fukushima", email = "kfuku52@gmail.com"},
]
keywords = ["batch", "cluster", "slurm", "uge", "sge"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pandas",
]

[project.urls]
Homepage = "https://github.com/kfuku52/kfbatch"
Repository = "https://github.com/kfuku52/kfbatch"

[project.scripts]
kfbatch = "kfbatch.cli:main"

[tool.setuptools.dynamic]
version = {attr = "kfbatch.__version__"}

[tool.setuptools.packages.find]
include = ["kfbatch*"]
